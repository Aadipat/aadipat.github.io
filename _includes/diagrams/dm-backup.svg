<svg viewBox="0 0 760 350" role="img" aria-label="Bellman backup tree. V(s) takes the maximum over actions. Each Q(s,a) is an expectation over next states, weighted by the transition probability, of reward plus discounted next value."><defs><marker id="dm-backup-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-tip"/></marker><marker id="dm-backup-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-tip-a"/></marker></defs>
<text x="70.0" y="23.2" class="d-m" text-anchor="middle" font-size="15"><tspan>V(s) = max</tspan><tspan dy="4.2" font-size="10.8">a</tspan><tspan dy="-4.2"> Q(s, a)</tspan></text>
<text x="270.0" y="23.2" class="d-m" text-anchor="middle" font-size="15"><tspan>Q(s, a)</tspan></text>
<text x="490.0" y="23.2" class="d-m" text-anchor="middle" font-size="15"><tspan>next state s′</tspan></text>
<text x="650.0" y="22.6" class="d-s" text-anchor="middle" font-size="13"><tspan>what it pays</tspan></text>
