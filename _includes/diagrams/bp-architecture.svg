<svg viewBox="0 0 760 322" role="img" aria-label="A sequence of layers, Linear, activation, Linear and loss, above the directed acyclic graph of tensors it resolves to. Each layer produces one tensor, and the Linear layers also bring in weight and bias tensors. Every edge is labelled with its local derivative."><defs><marker id="bp-architecture-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-tip"/></marker><marker id="bp-architecture-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-tip-a"/></marker></defs>
